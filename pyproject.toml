[project]
name = "digitalhuarongpass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
digitalhuarongpass = "render.window:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src 布局：把 src/ 下的 config、render 作为两个顶层包安装。
# 安装后 import config / import render 在任意目录都可用，
# 因此在 src/ 下按路径直接运行脚本也不会再报 No module named 'config'。
[tool.hatch.build.targets.wheel]
packages = ["src/config", "src/render"]
